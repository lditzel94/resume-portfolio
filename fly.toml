# fly.toml app configuration file generated for resume-portfolio on 2026-05-12T14:45:48-03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'luciano-ditzel-portfolio'
primary_region = 'gru'

[build]

# Availability badge: "open" | "busy" | "away" — drives both the label
# and the dot color in the top-right corner of the portfolio.
# Edit and `fly deploy` to flip it.
[env]
  STATUS = "busy"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
  cpus = 1
  memory_mb = 256
